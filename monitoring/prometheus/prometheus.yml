global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    metrics_path: "/prometheus/metrics"
    static_configs:
      - targets: ["172.30.30.10:9090"]

  - job_name: "node-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["172.30.30.30:9100"]

  - job_name: "cadvisor"
    metrics_path: "/metricas/metrics"
    static_configs:
      - targets: ["172.30.30.40:8080"]
